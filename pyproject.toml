[build-system]
requires = ["setuptools>=77", "cython>=3.0", "numpy>=1.26"]
build-backend = "setuptools.build_meta"

[project]
name = "segregation_amplification"
version = "1.0.0"
description = "Agent-based model nesting Schelling's binary-choice externality game inside his segregation model."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Justin Andrew Johnson", email = "jajohns@umn.edu" },
    { name = "Carlisle Ford Runge" },
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
test = ["pytest>=7"]
projectflow = ["hazelbean>=2.0"]

[project.urls]
Repository = "https://github.com/jandrewjohnson/segregation_amplification"

[tool.setuptools]
packages = ["segregation_amplification"]

[tool.pytest.ini_options]
testpaths = ["tests"]
